name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - 'CODEOWNERS'
      - '.github/CODEOWNERS'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - 'CODEOWNERS'
      - '.github/CODEOWNERS'

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private modules
        run: |
          echo "machine github.com login x-access-token password ${GH_PAT}" >> "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GOPRIVATE: github.com/pidgr/*

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
        env:
          GOPRIVATE: github.com/pidgr/*

      - name: Test
        run: go test ./... -cover -coverprofile=coverage.out
        env:
          GOPRIVATE: github.com/pidgr/*

      - name: Build
        run: go build ./...
        env:
          GOPRIVATE: github.com/pidgr/*

      - name: Cleanup credentials
        if: always()
        run: rm -f "${HOME}/.netrc"

name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - 'CODEOWNERS'
      - '.github/CODEOWNERS'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
      - 'CODEOWNERS'
      - '.github/CODEOWNERS'
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, go]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - if: matrix.language == 'go'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - if: matrix.language == 'go'
        name: Configure private modules
        run: |
          echo "machine github.com login x-access-token password ${GH_PAT}" >> "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9da17a5aa4abec2340d6e6c8d8efb0770b1c9cb8 # v4.32.3
        with:
          languages: ${{ matrix.language }}

      - if: matrix.language == 'go'
        name: Autobuild
        uses: github/codeql-action/autobuild@9da17a5aa4abec2340d6e6c8d8efb0770b1c9cb8 # v4.32.3
        env:
          GOPRIVATE: github.com/pidgr/*

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9da17a5aa4abec2340d6e6c8d8efb0770b1c9cb8 # v4.32.3
        with:
          category: "/language:${{ matrix.language }}"

      - if: always() && matrix.language == 'go'
        name: Cleanup credentials
        run: rm -f "${HOME}/.netrc"

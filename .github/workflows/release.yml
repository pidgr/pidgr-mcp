name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Configure private modules
        run: |
          echo "machine github.com login x-access-token password ${GH_PAT}" >> "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GOPRIVATE: github.com/pidgr/*

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.14.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPRIVATE: github.com/pidgr/*

      - name: Cleanup credentials
        if: always()
        run: rm -f "${HOME}/.netrc"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [goreleaser]
    env:
      AWS_REGION: us-east-1
      ECS_CLUSTER: pidgr-production
      ECS_SERVICE: pidgr-mcp-production
      TASK_FAMILY: pidgr-mcp-production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: arn:aws:iam::294382260612:role/github-ci-ecs
          aws-region: us-east-1

      - name: Extract version from tag

        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update task definition with new image

        id: task-def
        run: |
          # Fetch current task definition
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' > task-def.json

          # Update the container image to the versioned tag
          VERSION="${{ steps.version.outputs.tag }}"
          jq --arg IMAGE "ghcr.io/pidgr/pidgr-mcp:${VERSION}" \
            '.containerDefinitions[0].image = $IMAGE' task-def.json > updated.json

          # Register new task definition revision (strip fields ECS doesn't accept)
          jq '{
            family,
            taskRoleArn,
            executionRoleArn,
            networkMode,
            containerDefinitions,
            requiresCompatibilities,
            cpu,
            memory
          }' updated.json > register.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://register.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered new task definition: $NEW_ARN"

      - name: Update ECS service

        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-def.outputs.task_definition_arn }}" \
            --query 'service.serviceName' \
            --output text

      - name: Wait for service stability

        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Smoke test

        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" https://mcp.pidgr.com/)
          if [ "$HTTP_CODE" = "401" ]; then
            echo "MCP smoke test passed (auth middleware responding)"
          else
            echo "MCP smoke test failed (expected 401, got $HTTP_CODE)"
            exit 1
          fi
